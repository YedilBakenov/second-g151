<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="maket.html">
<head>
</head>
<body>
<div layout:fragment="other">
    <div class="row mt-2">
        <div class="col-12">
            <label>MODEL NAME</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.modelName}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <label>COST</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.cost}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <label>MODEL NAME</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.modelName}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <label>COLOR</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.color}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <label>ENGINE</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.engine}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <label>HORSE POWER</label>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <input class="form-control" type="text" th:value="${car.horsePower}">
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <button class="btn btn-success btn-sm">UPDATE CAR</button>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col-12">
            <button class="btn btn-success btn-danger">DELETE CAR</button>
        </div>
    </div>
</div>
</body>
</html>
