<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="maket.html">
<head>
</head>
<body>
<div layout:fragment="other">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>MODEL NAME</th>
            <th>COST</th>
            <th>COLOR</th>
            <th>ENGINE</th>
            <th>HORSE POWER</th>
            <th style="width: 8%">DETAILS</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car: ${cars}">
            <td th:text="${car.id}"></td>
            <td th:text="${car.modelName}"></td>
            <td th:text="${car.cost}"></td>
            <td th:text="${car.color}"></td>
            <td th:text="${car.engine}"></td>
            <td th:text="${car.horsePower}"></td>
            <td><a class="btn btn-secondary btn-sm" th:href="@{'/get-car/' + ${car.id}}">DETAILS</a></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
